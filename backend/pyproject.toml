[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdui-backend"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" },
]
description = "SDUI Backend Service"
readme = "README.md"
requires-python = ">=3.8"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--import-mode=importlib"

[tool.poetry]
packages = [
    { include = "app" }
] 