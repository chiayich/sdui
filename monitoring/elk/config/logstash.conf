input {
  # Kafka输入
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["sdui-logs"]
    codec => "json"
    consumer_threads => 3
    decorate_events => true
    client_id => "logstash"
    group_id => "logstash-group"
    auto_offset_reset => "latest"
  }
  
  # Beats输入(从Filebeat收集)
  beats {
    port => 5044
    host => "0.0.0.0"
    client_inactivity_timeout => 60
  }
  
  # TCP输入(直接从应用发送日志)
  tcp {
    port => 5000
    codec => json
  }
  
  # UDP输入
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # 解析JSON格式的日志
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # 时间戳处理
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS" ]
    target => "@timestamp"
    remove_field => [ "timestamp" ]
  }
  
  # 应用类型标记
  if [application] =~ /frontend/ {
    mutate {
      add_field => { "app_type" => "frontend" }
    }
  } else if [application] =~ /backend/ {
    mutate {
      add_field => { "app_type" => "backend" }
    }
  }
  
  # 日志级别处理
  if [level] in ["ERROR", "FATAL"] {
    mutate {
      add_tag => ["error"]
    }
  } else if [level] == "WARNING" {
    mutate {
      add_tag => ["warning"]
    }
  } else if [level] == "INFO" {
    mutate {
      add_tag => ["info"]
    }
  } else if [level] == "DEBUG" {
    mutate {
      add_tag => ["debug"]
    }
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "sdui-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    manage_template => true
    template_overwrite => true
  }
  
  # 调试输出
  if [level] == "DEBUG" {
    file {
      path => "/var/log/logstash/debug.log"
      codec => rubydebug
    }
  }
  
  # 错误日志单独存储
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "sdui-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
} 