services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sdui-prometheus
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sdui-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: sdui-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "9091:3000"
    depends_on:
      - prometheus
    networks:
      - sdui-monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sdui-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    networks:
      - sdui-monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sdui-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - sdui-monitoring

networks:
  sdui-monitoring:
    external: true

volumes:
  prometheus-data:
  grafana-data: 