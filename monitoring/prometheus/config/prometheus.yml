global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # SkyWalking OAP服务指标
  - job_name: 'skywalking'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['oap:1234']

  # FastAPI应用指标收集
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  # Vue应用指标收集（如果前端使用Prometheus客户端）
  - job_name: 'vue-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  # Kafka指标
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  # Loki指标
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100'] 