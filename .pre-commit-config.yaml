repos:
  # Python检查器
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2048']  # 设置最大文件大小为2MB
      - id: debug-statements
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key  # 检测私钥
      - id: check-case-conflict  # 检查文件名大小写冲突

  # Python代码格式化
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3
        types: [python]
        args: ["--line-length=100"]

  # Python代码静态分析
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies: 
          - flake8-docstrings
          - flake8-bugbear  # 检测bug和设计问题
          - flake8-comprehensions  # 优化列表/集合/字典推导式
          - flake8-simplify  # 代码简化建议
        types: [python]
        args: [
          "--max-line-length=100",
          "--ignore=E203,W503,D100,D104,D105,D107",
          "--max-complexity=12"  # 限制代码复杂度
        ]

  # 导入排序
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        types: [python]
        args: ["--profile", "black", "--line-length=100"]

  # JavaScript/TypeScript格式化
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, vue, css, scss, html, json, yaml, markdown]
        additional_dependencies:
          - prettier@2.8.8
          - prettier-plugin-tailwindcss@0.4.1
        args: [
          '--print-width=100',
          '--tab-width=2',
          '--use-tabs=false',
          '--semi=true',
          '--single-quote=true',
          '--trailing-comma=es5',
          '--bracket-spacing=true',
          '--arrow-parens=avoid'
        ]

  # ESLint检查
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.49.0
    hooks:
      - id: eslint
        types_or: [javascript, jsx, ts, tsx, vue]
        additional_dependencies:
          - eslint@8.49.0
          - eslint-plugin-vue@9.17.0
          - "@typescript-eslint/eslint-plugin@6.7.4"
          - "@typescript-eslint/parser@6.7.4"
          - "eslint-config-prettier@9.0.0"  # 避免与 Prettier 冲突
          - "eslint-plugin-prettier@5.0.0"  # 将 Prettier 规则整合到 ESLint 中
        args: [
          '--fix',
          '--max-warnings=0'  # 将警告视为错误
        ]

  # 提交消息规范检查
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.12.0
    hooks:
      - id: commitizen
        stages: [commit-msg] 