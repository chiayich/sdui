services:
  # 主后端应用服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no" # 开发环境不自动重启
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=5433
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sdui
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=DEBUG # 增加日志详细程度
      - PYTHONUNBUFFERED=1 # 确保Python不缓冲输出
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app # 挂载本地目录以便实时开发
    command: >
      sh -c "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 --log-level debug"
    stdin_open: true # 开启终端输入
    tty: true # 分配TTY
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端应用服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: "no" # 开发环境不自动重启
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app # 挂载本地目录以便实时开发
      - /app/node_modules # 避免覆盖容器内的node_modules
    command: npm run dev -- --host 0.0.0.0 # 确保监听所有网络接口
    stdin_open: true # 开启终端输入
    tty: true # 分配TTY
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL数据库服务
  db:
    image: postgres:14-alpine
    container_name: sdui-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sdui
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis缓存服务
  redis:
    image: redis:alpine
    container_name: sdui-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
