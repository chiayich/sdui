services:
  # 主后端应用服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sdui
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # 前端应用服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  # PostgreSQL数据库服务
  db:
    image: postgres:14-alpine
    container_name: sdui-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sdui
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /tmp/postgres-init:/docker-entrypoint-initdb.d

  # Redis缓存服务
  redis:
    image: redis:alpine
    container_name: sdui-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  postgres-init-data:
