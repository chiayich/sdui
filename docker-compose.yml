version: '3.8'

services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: sdui-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=sdui
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sdui-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 后端API服务
  sdui-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdui-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sdui
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DEBUG=True
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - sdui-network

  # 前端服务
  sdui-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdui-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - sdui-api
    networks:
      - sdui-network

  # Redis缓存服务
  redis:
    image: redis:alpine
    container_name: sdui-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sdui-network

volumes:
  redis-data:
  postgres-data:
    name: sdui-postgres-data

networks:
  sdui-network:
    name: sdui-network
    driver: bridge
